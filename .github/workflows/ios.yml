name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'swaara-pc/package-lock.json'

      - name: Install Dependencies
        working-directory: ./swaara-pc
        run: npm ci

      - name: Build Web Production Assets
        working-directory: ./swaara-pc
        run: npm run build

      - name: Sync Capacitor iOS Platform
        working-directory: ./swaara-pc
        run: npx cap sync ios

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Xcode Archive
        run: |
          xcodebuild \
            -project swaara-pc/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r A1_Swaara_iOS.ipa Payload
          echo "Generated IPA: build/A1_Swaara_iOS.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A1_Swaara_iOS.ipa
          path: build/A1_Swaara_iOS.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release (Tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: build/A1_Swaara_iOS.ipa
