<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <linearGradient id="audioFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20cfff"/>
      <stop offset="50%" stop-color="#ff2daa"/>
      <stop offset="100%" stop-color="#7f52ff"/>
    </linearGradient>

    <pattern id="audio-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#181c2e"/>
    </pattern>

    <style>
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pulse-core {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 45, 170, 0.4)); }
        50% { filter: drop-shadow(0 0 14px rgba(32, 207, 255, 0.8)); }
      }
      .signal-wire {
        stroke-dasharray: 6, 6;
        animation: dash 1.3s linear infinite;
      }
      .core-dsp {
        animation: pulse-core 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="920" height="220" rx="14" fill="#090b12" stroke="#1c2033" stroke-width="1"/>
  <rect width="920" height="220" rx="14" fill="url(#audio-grid)"/>

  <!-- Animated Signal Flow Wires -->
  <path class="signal-wire" d="M 220 110 L 330 110" stroke="url(#audioFlow)" stroke-width="2.5" fill="none"/>
  <path class="signal-wire" d="M 580 110 L 680 110" stroke="url(#audioFlow)" stroke-width="2.5" fill="none"/>

  <!-- Stage 1: Ingestion & Stream Extraction -->
  <g transform="translate(30, 40)">
    <rect width="190" height="140" rx="10" fill="#0f121e" stroke="#222a42" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#1b233a"/>
    <text x="29" y="34" fill="#20cfff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">01</text>
    <text x="52" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">STREAM INTAKE</text>
    
    <text x="15" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• VisionOS Stream Extractor</text>
    <text x="15" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• OPUS 251kbps / AAC 256k</text>
    <text x="15" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• 240s Buffer Anti-Stutter</text>
    <rect x="15" y="125" width="160" height="2" fill="#20cfff" opacity="0.6"/>
  </g>

  <!-- Stage 2: 32-bit Floating PCM & DSP Core -->
  <g class="core-dsp" transform="translate(330, 30)">
    <rect width="250" height="160" rx="12" fill="#131424" stroke="#ff2daa" stroke-width="1.8"/>
    <rect x="18" y="16" width="32" height="32" rx="7" fill="#2b1a3d"/>
    <text x="34" y="37" fill="#ff70c9" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" text-anchor="middle">02</text>
    <text x="60" y="37" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800">AUDIO DSP CORE</text>
    
    <text x="18" y="76" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ 32-Bit Float PCM Signal</text>
    <text x="18" y="98" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ 10-Band Parametric EQ</text>
    <text x="18" y="120" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ +12dB Sub-Harmonic Bass</text>
    <text x="18" y="142" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11.5">⚡ Timestamped Karaoke Sync</text>
    <rect x="18" y="152" width="214" height="2" fill="url(#audioFlow)"/>
  </g>

  <!-- Stage 3: Cross-Platform Hardware Output -->
  <g transform="translate(680, 40)">
    <rect width="210" height="140" rx="10" fill="#0f121e" stroke="#222a42" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#1b233a"/>
    <text x="29" y="34" fill="#7f52ff" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">03</text>
    <text x="52" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">CLIENT EDITIONS</text>
    
    <text x="15" y="70" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Android ExoPlayer Engine</text>
    <text x="15" y="92" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Windows Electron Studio</text>
    <text x="15" y="114" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">• Offline 320kbps MP3 Sink</text>
    <rect x="15" y="125" width="180" height="2" fill="#7f52ff" opacity="0.6"/>
  </g>
</svg>
